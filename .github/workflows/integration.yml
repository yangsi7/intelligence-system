name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration:
    name: End-to-End Integration Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y jq
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install jq
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock pytest-timeout

      - name: Full installation test
        run: |
          echo "Running full installation..."
          bash install.sh

      - name: Create test project with PROJECT_INDEX
        run: |
          echo "Creating test project..."
          mkdir -p test_project/src
          echo "export function hello() { return 'Hello'; }" > test_project/src/index.js
          echo "def greet(): return 'Hi'" > test_project/src/utils.py

          cd test_project
          python "$HOME/.claude-intelligence-system/scripts/project_index.py"

          if [ -f "PROJECT_INDEX.json" ]; then
            echo "✓ PROJECT_INDEX.json created"
          else
            echo "✗ PROJECT_INDEX.json not created"
            exit 1
          fi

      - name: Test /intel compact command simulation
        run: |
          cd test_project
          if [ -f "PROJECT_INDEX.json" ]; then
            node "$HOME/.claude-intelligence-system/improved_intelligence/code-intel.mjs" help
            echo "✓ Intelligence CLI is functional"
          fi

      - name: Test agent definitions load
        run: |
          echo "Verifying agent definitions..."
          for agent in orchestrator researcher implementor reviewer tester postflight index-analyzer; do
            if [ -f "$HOME/.claude/agents/$agent.md" ]; then
              # Check for YAML frontmatter
              if head -n 1 "$HOME/.claude/agents/$agent.md" | grep -q "^---$"; then
                echo "✓ $agent.md has valid frontmatter"
              else
                echo "⚠ $agent.md may have invalid frontmatter"
              fi
            else
              echo "✗ $agent.md not found"
              exit 1
            fi
          done

      - name: Test slash commands exist
        run: |
          echo "Verifying slash commands..."
          for cmd in intel orchestrate search validate workflow index; do
            if [ -f "$HOME/.claude/commands/$cmd.md" ]; then
              echo "✓ /$cmd command exists"
            else
              echo "✗ /$cmd command not found"
              exit 1
            fi
          done

      - name: Run Python test suite
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -v
          echo "✓ All 125 Python tests passed"

      - name: Verify complete workflow
        run: |
          echo "Integration test summary:"
          echo "✓ Installation successful"
          echo "✓ PROJECT_INDEX generation works"
          echo "✓ Intelligence CLI functional"
          echo "✓ All agents installed"
          echo "✓ All slash commands installed"
          echo "✓ Python tests passing"
          echo "✓ End-to-end integration successful"

      - name: Cleanup test installation
        run: |
          bash "$HOME/.claude-intelligence-system/uninstall.sh"
